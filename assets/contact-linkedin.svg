  <rect x="448" y="8" width="13" height="13" fill="#c8c8d8" stroke="#fff"/>
  <text x="451" y="18" class="t" font-size="10" fill="#1a0b3d">x</text>
  <rect x="10" y="30" width="452" height="56" fill="#1a0b3d"/>
  <g class="bob">
    <image x="22" y="40.4" width="38" height="35.2" href="data:image/png;base64,"/>
  </g>
  <text x="76" y="52" class="t" font-size="11" fill="#8a7fb8" letter-spacing="2">LINKEDIN</text>
  <text x="76" y="73" class="t" font-size="16" fill="#ffd23f">/in/luick-vieira</text>
