<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 30" width="1000" height="30">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3d8b" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#ff3d8b"/>
      <stop offset="0.5" stop-color="#2b3cff"/>
      <stop offset="0.7" stop-color="#20e3b2"/>
      <stop offset="1" stop-color="#20e3b2" stop-opacity="0"/>
    </linearGradient>
    <style>.s{transform-origin:500px 16px;animation:r 6s linear infinite}@keyframes r{to{transform:rotate(360deg)}}</style>
  </defs>
  <rect x="0" y="14" width="440" height="2" fill="url(#g)"/>
  <rect x="560" y="14" width="440" height="2" fill="url(#g)"/>
  <!-- quadrado vazado vermelho (fixo) -->
  <rect x="461" y="8" width="14" height="14" fill="none" stroke="#e8322c" stroke-width="3"/>
  <!-- triângulo amarelo preenchido (girando) -->
  <g class="s"><polygon points="500,4 511,22 489,22" fill="#ffd23f"/></g>
  <!-- círculo vazado (fixo) -->
  <circle cx="532" cy="15" r="7" fill="none" stroke="#20e3b2" stroke-width="3"/>
</svg>
