<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b3cff"/>
      <stop offset="1" stop-color="#20e3b2"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0b3d"/>
      <stop offset="1" stop-color="#2a0f55"/>
    </linearGradient>
    <style>
      .m{font-family:'Courier New',monospace;font-weight:700;font-size:20px}
      .kw{fill:#ff3d8b}.p{fill:#e8e6ff}.dim{fill:#8a7fb8}.s{fill:#20e3b2}
      .k1{fill:#ffd23f}.k2{fill:#ff3d8b}.k3{fill:#7ea2ff}.k4{fill:#20e3b2}
      .l1{animation:in .4s ease-out .2s both}.l2{animation:in .4s ease-out .6s both}
      .l3{animation:in .4s ease-out 1s both}.l4{animation:in .4s ease-out 1.4s both}
      .l5{animation:in .4s ease-out 1.8s both}.l6{animation:in .4s ease-out 2.2s both}
      .blink{animation:b 1s steps(1) infinite}
      .spin{transform-origin:880px 150px;animation:r 9s linear infinite}
      .float{animation:f 4s ease-in-out infinite}
      @keyframes in{from{opacity:0}to{opacity:1}}
      @keyframes b{50%{opacity:0}}
      @keyframes r{to{transform:rotate(360deg)}}
      @keyframes f{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    </style>
  </defs>

  <!-- janela -->
  <rect x="14" y="14" width="980" height="400" fill="#000" opacity="0.35"/>
  <rect x="6" y="6" width="980" height="400" fill="#c8c8d8" stroke="#fff" stroke-width="2"/>
  <rect x="10" y="10" width="972" height="26" fill="url(#bar)"/>
  <text x="22" y="28" font-family="'Courier New',monospace" font-weight="700" font-size="14" fill="#fff">stack.js</text>
  <g>
    <rect x="914" y="14" width="18" height="16" fill="#c8c8d8" stroke="#fff"/>
    <rect x="936" y="14" width="18" height="16" fill="#c8c8d8" stroke="#fff"/>
    <rect x="958" y="14" width="18" height="16" fill="#c8c8d8" stroke="#fff"/>
    <rect x="918" y="24" width="10" height="2" fill="#1a0b3d"/>
    <rect x="940" y="18" width="10" height="8" fill="none" stroke="#1a0b3d" stroke-width="2"/>
    <text x="962" y="27" font-family="'Courier New',monospace" font-weight="700" font-size="13" fill="#1a0b3d">x</text>
  </g>
  <rect x="16" y="42" width="960" height="356" fill="url(#bg)"/>

  <!-- código: cada parte com x fixo para não depender da largura da fonte -->
  <text x="40" y="92" class="m"><tspan class="kw">const</tspan><tspan class="p"> luick = {</tspan></text>

  <g class="l1">
    <text x="80" y="138" class="m k1">languages:</text>
    <text x="240" y="138" class="m p">[<tspan class="s">"Python"</tspan>, <tspan class="s">"JavaScript"</tspan>, <tspan class="s">"SQL"</tspan>],</text>
  </g>
  <g class="l2">
    <text x="80" y="180" class="m k2">frontend:</text>
    <text x="240" y="180" class="m p">[<tspan class="s">"HTML"</tspan>, <tspan class="s">"CSS"</tspan>, <tspan class="s">"React"</tspan>, <tspan class="s">"Next.js"</tspan>],</text>
  </g>
  <g class="l3">
    <text x="80" y="222" class="m k3">backend:</text>
    <text x="240" y="222" class="m p">[<tspan class="s">"Python"</tspan>, <tspan class="s">"Supabase"</tspan>, <tspan class="s">"Firebase"</tspan>],</text>
  </g>
  <g class="l4">
    <text x="80" y="264" class="m k1">editors:</text>
    <text x="240" y="264" class="m p">[<tspan class="s">"VS Code"</tspan>, <tspan class="s">"Antigravity"</tspan>],</text>
  </g>
  <g class="l5">
    <text x="80" y="306" class="m k4">tools:</text>
    <text x="240" y="306" class="m p">[<tspan class="s">"Git"</tspan>, <tspan class="s">"GitHub"</tspan>, <tspan class="s">"Figma"</tspan>, <tspan class="s">"Claude"</tspan>],</text>
  </g>

  <text x="40" y="348" class="m p">};</text>
  <g class="l6">
    <text x="40" y="384" class="m dim">// status: always learning</text>
    <rect x="360" y="372" width="11" height="4" fill="#fff" class="blink"/>
  </g>

  <!-- decoração -->
  <g class="spin">
    <polygon points="880,118 908,166 852,166" fill="#ffd23f"/>
  </g>
  <g class="float">
    <rect x="800" y="230" width="34" height="34" fill="none" stroke="#e8322c" stroke-width="5"/>
  </g>
  <circle cx="920" cy="310" r="16" fill="none" stroke="#20e3b2" stroke-width="5"/>
  <circle cx="830" cy="90" r="6" fill="#ff3d8b"/>
</svg>
